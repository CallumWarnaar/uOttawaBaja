<!--
title: Full Roster | Rough Rider Racing
description: Every student who designs, builds and races with Rough Rider Racing, the University of Ottawa Baja SAE team, with individual member profiles.
og_image: img_6036.jpg
-->
    <!--
      FULL ROSTER
      The people and their profiles live in  baja-site/assets/js/roster-data.js  (edit that file, no build needed).
      This page only holds the controls and empty containers; assets/js/roster.js renders the cards and profiles.
      Each profile has its own link: roster.html#firstname-lastname
    -->
    <section class="hero hero--page hero--short" aria-labelledby="page-title">
      <div class="hero__media"><img src="assets/img/photos/img_6036.jpg" alt="The team gathered around the car" fetchpriority="high"></div>
      <span class="hero__number" aria-hidden="true">230</span>
      <div class="container hero__content">
        <p class="kicker">The full roster</p>
        <h1 id="page-title" class="hero__title worn worn--light">
          <span class="line"><span>Every name</span></span>
          <span class="line"><span class="stencil">on the car.</span></span>
        </h1>
        <p class="hero__lead">Everyone who contributes to Rough Rider Racing. Select a member to read their profile: what they work on, what they've built, and where they're headed.</p>
        <div class="btn-row"><a class="btn btn--ghost" href="team.html"><span class="arrow">←</span> Back to the team</a></div>
      </div>
    </section>

    <section class="section section--tight" aria-labelledby="roster-title">
      <div class="container">
        <h2 id="roster-title" class="visually-hidden">Team members</h2>
        <div class="roster-controls">
          <div class="roster-filter" role="group" aria-label="Filter by subteam" data-roster-filters></div>
          <div class="roster-sort">
            <label for="roster-sort">Sort by</label>
            <select id="roster-sort" data-roster-sort>
              <option value="alpha">Name (A–Z)</option>
              <option value="seniority">Seniority</option>
            </select>
          </div>
        </div>
        <p class="roster-count" data-roster-count aria-live="polite"></p>
        <div class="grid grid--members roster-grid" data-roster-grid>
          <noscript><p class="muted">The roster needs JavaScript to display. Email <a class="text-link" href="mailto:baja@uottawa.ca">baja@uottawa.ca</a> to get in touch with a member.</p></noscript>
        </div>
      </div>
    </section>

    <!-- Profile drawer (filled in by roster.js) -->
    <div class="profile" hidden data-profile role="dialog" aria-modal="true" aria-labelledby="profile-name">
      <div class="profile__backdrop" data-profile-close></div>
      <article class="profile__panel" tabindex="-1">
        <div class="profile__bar">
          <button type="button" class="profile__nav" data-profile-prev aria-label="Previous member">←</button>
          <button type="button" class="profile__nav" data-profile-next aria-label="Next member">→</button>
          <button type="button" class="profile__close" data-profile-close aria-label="Close profile">✕</button>
        </div>
        <div class="profile__body" data-profile-body></div>
      </article>
    </div>

    <script src="assets/js/roster-data.js" defer></script>
    <script src="assets/js/roster.js" defer></script>
