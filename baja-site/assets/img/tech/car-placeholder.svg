  <!-- electrical: kill switch + harness -->
  <rect x="920" y="330" width="44" height="44" fill="#8f001a"/><circle cx="942" cy="352" r="11" fill="#f2f2f2"/>
  <path d="M942 374 C 940 430, 1010 450, 1040 452" stroke="#908681" stroke-width="3" stroke-dasharray="10 8"/>
