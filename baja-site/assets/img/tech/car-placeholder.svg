  <g stroke="#f2f2f2" stroke-width="5">
    <rect x="1030" y="320" width="180" height="130" rx="12"/>
    <path d="M1050 320 v-30 h56 v30 M1140 320 v-44 h52 v44"/>
    <path d="M1050 350 h140 M1050 375 h140 M1050 400 h140 M1050 425 h140" stroke-width="2"/>
